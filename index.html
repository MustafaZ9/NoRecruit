<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance Hub - No Recruit & Guides & LoD INTEL</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        /* ============================================
           SHARED & NO RECRUIT STYLES
           ============================================ */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent-color: #e53935;
            --reason-color: #ffd700;
            --border-color: #333;

            /* Guides Specific Variables */
            --guide-accent: #3b82f6;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .nr-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(229, 57, 53, 0.5);
            margin-top: 40px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            white-space: nowrap;
        }

        .nr-title:hover {
            transform: scale(1.05);
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
        }

        .status-indicator {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Roboto Mono', monospace;
            font-size: 1.1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        #results-area {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-card {
            background-color: rgba(229, 57, 53, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: 5px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            animation: fadeIn 0.2s ease-in-out;
        }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #ff8a80;
        }

        .player-id {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 4px;
        }

        .player-reason {
            font-size: 0.85em;
            color: var(--reason-color);
            margin-top: 8px;
            font-style: italic;
            border-left: 2px solid var(--reason-color);
            padding-left: 8px;
        }

        .ban-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            font-family: 'Orbitron', sans-serif;
            white-space: nowrap;
            margin-left: 10px;
        }

        .add-btn {
            margin-top: 30px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 0.9em;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .add-btn:hover {
            background-color: #c62828;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .no-match {
            text-align: center;
            color: #4caf50;
            padding: 20px;
            border: 1px dashed #4caf50;
            border-radius: 5px;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            color: #666;
            margin-top: 30px;
            font-style: italic;
        }

        /* ============================================
           MODAL STYLES
           ============================================ */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.2s;
        }

        .modal-content {
            background-color: var(--card-bg);
            margin: 2% auto;
            padding: 30px;
            border: 1px solid var(--accent-color);
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(229, 57, 53, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-color);
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }

        .close:hover {
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.9em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-main);
            font-family: 'Roboto Mono', monospace;
            font-size: 1em;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9em;
            transition: 0.3s;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-submit:hover {
            background-color: #c62828;
        }

        .btn-cancel {
            background-color: #333;
            color: #aaa;
        }

        .btn-cancel:hover {
            background-color: #444;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .success-message {
            background-color: rgba(76, 175, 80, 0.1);
            border: 1px solid #4caf50;
            color: #4caf50;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .error-message {
            background-color: rgba(229, 57, 53, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        /* ============================================
           PAGE SEPARATOR
           ============================================ */
        .page-divider {
            width: 80%;
            max-width: 1000px;
            border: 0;
            height: 1px;
            background-color: var(--border-color);
            margin: 60px 0;
        }

        /* ============================================
           GUIDES SECTION STYLES
           ============================================ */
        .guides-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .guides-header {
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .guides-title {
            margin: 0 0 1rem 0;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--text-main);
        }

        #guidesSearchInput:focus {
            border-color: var(--guide-accent);
        }

        .guides-container {
            max-width: 1000px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            box-sizing: border-box;
        }

        .guide-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .guide-title {
            margin: 0 0 1rem 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--guide-accent);
            padding-right: 3rem;
        }

        .guide-content {
            font-size: 0.95rem;
            white-space: pre-wrap;
            color: var(--text-muted);
            flex-grow: 1;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .guide-content a {
            color: var(--guide-accent);
            text-decoration: none;
        }

        .guide-content a:hover {
            text-decoration: underline;
        }

        .copy-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background-color: var(--guide-accent);
            border-color: var(--guide-accent);
            color: white;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            padding: 2rem;
        }

        /* ============================================
           LOD INTEL SECTION STYLES (Appended)
           ============================================ */
        .lod-theme {
            --text-muted-lod: #a0a0a0;
            --lod-accent-color: #00d4ff;
            /* Intel Blue */
            --r5-color: #ffd700;
            /* Gold */
            --r4-color: #c0c0c0;
            /* Silver */
            --former-color: #ff6b6b;
            /* Red */

            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lod-theme header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .lod-theme h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            margin: 0;
            letter-spacing: 4px;
            color: var(--lod-accent-color);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .lod-theme .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted-lod);
            margin-top: 5px;
        }

        .lod-theme .lod-container {
            width: 90%;
            max-width: 1000px;
        }

        .lod-theme .search-wrapper {
            margin-bottom: 30px;
            width: 100%;
        }

        .lod-theme input[type="text"]:focus {
            border-color: var(--lod-accent-color);
        }

        .lod-theme #nav-controls {
            margin-bottom: 20px;
            display: none;
        }

        .lod-theme .btn-back {
            background: transparent;
            border: 1px solid var(--lod-accent-color);
            color: var(--lod-accent-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
        }

        .lod-theme .btn-back:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        .lod-theme .alliance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .lod-theme .alliance-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .lod-theme .alliance-card:hover {
            transform: translateY(-5px);
            border-color: var(--lod-accent-color);
        }

        .lod-theme .alliance-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .lod-theme .alliance-count {
            margin-top: 10px;
            color: var(--text-muted-lod);
            font-size: 0.9rem;
        }

        .lod-theme .alliance-count-former {
            margin-top: 5px;
            color: var(--former-color);
            font-size: 0.75rem;
            font-weight: bold;
            opacity: 0.8;
        }

        .lod-theme .table-container {
            width: 100%;
            overflow-x: auto;
            display: none;
        }

        .lod-theme .last-update {
            font-size: 0.75rem;
            color: var(--lod-accent-color);
            margin-top: 8px;
            opacity: 0.8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .lod-theme .copy-feedback {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--lod-accent-color);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .lod-theme .copy-feedback.show {
            opacity: 1;
        }

        .lod-theme .clickable-id {
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        .lod-theme .clickable-id:hover {
            color: var(--lod-accent-color);
        }

        .lod-theme table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        .lod-theme th,
        .lod-theme td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .lod-theme th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #252525;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .lod-theme tr:hover {
            background-color: #2a2a2a;
        }

        .lod-theme tr.is-former {
            opacity: 0.5;
        }

        .lod-theme tr.is-former td {
            color: var(--former-color);
        }

        .lod-theme .rank-badge {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            background: #333;
            font-size: 0.8rem;
        }

        .lod-theme .rank-R5 {
            color: var(--r5-color);
            border: 1px solid var(--r5-color);
            background: rgba(255, 215, 0, 0.1);
        }

        .lod-theme .rank-R4 {
            color: var(--r4-color);
            border: 1px solid var(--r4-color);
            background: rgba(192, 192, 192, 0.1);
        }

        .lod-theme .rank-R3,
        .lod-theme .rank-R2,
        .lod-theme .rank-R1 {
            color: var(--text-muted-lod);
        }

        .lod-theme .lod-hidden {
            display: none !important;
        }

        .lod-theme .lod-visible {
            display: block !important;
        }

        .lod-theme .lod-grid-visible {
            display: grid !important;
        }

        .lod-theme .lod-no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-muted-lod);
        }

        /* ============================================
           REDEEM GIFT CODE FLOATING BUTTON
           ============================================ */
        .redeem-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a1a;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 210, 0, 0.4), 0 0 30px rgba(247, 151, 30, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: redeemPulse 2.5s ease-in-out infinite;
        }

        .redeem-fab:hover {
            transform: scale(1.12);
            box-shadow: 0 6px 30px rgba(255, 210, 0, 0.6), 0 0 40px rgba(247, 151, 30, 0.4);
        }

        .redeem-fab:active {
            transform: scale(0.95);
        }

        .redeem-fab .fab-tooltip {
            position: absolute;
            right: 80px;
            background: #1e1e1e;
            color: #ffd200;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            border: 1px solid rgba(255, 210, 0, 0.3);
        }

        .redeem-fab:hover .fab-tooltip {
            opacity: 1;
        }

        @keyframes redeemPulse {

            0%,
            100% {
                box-shadow: 0 4px 20px rgba(255, 210, 0, 0.4), 0 0 30px rgba(247, 151, 30, 0.2);
            }

            50% {
                box-shadow: 0 4px 25px rgba(255, 210, 0, 0.6), 0 0 45px rgba(247, 151, 30, 0.35);
            }
        }

        /* Redeem Toast Notification */
        .redeem-toast {
            position: fixed;
            bottom: 110px;
            right: 30px;
            background: linear-gradient(145deg, #1e1e1e, #2a2a2a);
            border: 1px solid rgba(255, 210, 0, 0.3);
            color: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 1000;
        }

        .redeem-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .redeem-toast.success {
            border-color: #4caf50;
            color: #4caf50;
        }

        .redeem-toast.error {
            border-color: #e53935;
            color: #e53935;
        }

        @media (max-width: 480px) {
            .redeem-fab {
                width: 58px;
                height: 58px;
                font-size: 1.5rem;
                bottom: 20px;
                right: 20px;
            }

            .redeem-toast {
                bottom: 90px;
                right: 20px;
            }
        }
    </style>
</head>

<body>

    <h1 class="nr-title" onclick="location.reload()" title="Click to Reset">🚫 NO RECRUIT LIST</h1>
    <div id="loading-text" class="status-indicator">Connecting to database...</div>

    <div class="container">
        <input type="text" id="searchInput" placeholder="Type ID or Name to search..." autocomplete="off" disabled>
        <div id="results-area"></div>
    </div>

    <button class="add-btn" id="openModalBtn">+ Add Player to the list</button>

    <div id="addPlayerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-header">Add Player to the list</div>

            <form id="addPlayerForm">
                <div class="form-group">
                    <label for="playerName">Player Name</label>
                    <input type="text" id="playerName">
                </div>

                <div class="form-group">
                    <label for="playerId">Player ID *</label>
                    <input type="text" id="playerId" required>
                </div>

                <div class="form-group">
                    <label for="playerReason">Reason (Optional)</label>
                    <textarea id="playerReason" placeholder="Why is this player being in NoRecruit?"></textarea>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-cancel" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-submit" id="submitBtn">Add to the list</button>
                </div>
            </form>

            <div class="success-message" id="successMessage">✅ Player added successfully!</div>
            <div class="error-message" id="errorMessage">❌ Failed to add player. Please try again.</div>
        </div>
    </div>

    <hr class="page-divider">

    <div class="guides-section">
        <div class="guides-header">
            <h1 class="guides-title">Kingshot Guides</h1>
            <input type="text" id="guidesSearchInput" placeholder="Search for guides (e.g., Vikings, Hero)...">
        </div>

        <div class="guides-container" id="guidesContainer">
        </div>
    </div>

    <hr class="page-divider">

    <div class="lod-theme">
        <header>
            <h1>1247 Archive</h1>
            <div class="last-update">LAST UPDATE: 12/06/2025</div>
        </header>

        <div class="lod-container">
            <div class="search-wrapper">
                <input type="text" id="lodSearchInput" placeholder="Search by ID, Name, or Alliance...">
            </div>

            <div id="nav-controls">
                <button class="btn-back" onclick="window.resetViewLod()">← BACK TO ALLIANCES</button>
                <span id="current-view-title"
                    style="margin-left: 15px; color: var(--lod-accent-color); font-weight: bold;"></span>
            </div>

            <div id="alliance-list" class="alliance-grid">
            </div>

            <div id="player-list" class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 15%">Rank</th>
                            <th style="width: 20%">Alliance</th>
                            <th style="width: 40%">Name</th>
                            <th style="width: 25%">ID</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                    </tbody>
                </table>
                <div id="no-results-msg" class="lod-no-results lod-hidden">No matching intelligence found.</div>
            </div>
            <div id="toast" class="copy-feedback">ID Copied to Clipboard!</div>
        </div>
    </div>

    <!-- Floating Redeem Gift Code Button -->
    <button class="redeem-fab" id="redeemFab" title="Redeem Gift Code">
        🎁
        <span class="fab-tooltip">Redeem Gift Code</span>
    </button>

    <!-- Toast Notification for Redeem -->
    <div id="redeemToast" class="redeem-toast"></div>

    <script>
        /* --------------------------------------------------------------------------
           NO RECRUIT SCRIPT LOGIC
           -------------------------------------------------------------------------- */

        const resultsArea = document.getElementById('results-area');
        const loadingText = document.getElementById('loading-text');

        const modal = document.getElementById('addPlayerModal');

        function loadData() {
            fetch(SHEET_CSV_URL)
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.text();
                })
                .then(csvText => {
                    blockedPlayers = parseCSV(csvText);
                    loadingText.innerText = `Database Loaded: ${blockedPlayers.length} Records`;
                    loadingText.style.color = "#4caf50";
                    searchInput.disabled = false;
                    searchInput.placeholder = "Type ID or Name to search...";
                })
                .catch(error => {
                    console.error('Error loading sheet:', error);
                    loadingText.innerText = "Connection Failed.";
                    loadingText.style.color = "red";
                });
        }
        loadData();

        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const cleanCols = parts.map(col => col.replace(/^"|"$/g, '').trim());

                if (cleanCols.length >= 2) {
                    result.push({
                        id: cleanCols[1] || "Unknown",
                        name: cleanCols[2] || "Unknown",
                        reason: cleanCols[3] || ""
                    });
                }
            }
            return result;
        }

        searchInput.addEventListener('input', function () {
            const query = this.value.trim().toLowerCase();
            resultsArea.innerHTML = '';

            if (query === '') {
                resultsArea.innerHTML = '<div class="empty-state">Enter data to check database...</div>';
                return;
            }

            const matches = blockedPlayers.filter(player =>
                player.id.includes(query) || player.name.toLowerCase().includes(query)
            );

            if (matches.length > 0) {
                matches.forEach(player => {
                    const card = document.createElement('div');
                    card.className = 'result-card';
                    const reasonHtml = player.reason ? `<div class="player-reason">Reason: ${player.reason}</div>` : '';

                    card.innerHTML = `
                        <div class="player-info">
                            <span class="player-name">${player.name}</span>
                            <span class="player-id">ID: ${player.id}</span>
                            ${reasonHtml}
                        </div>
                        <span class="ban-badge">NO RECRUIT</span>
                    `;
                    resultsArea.appendChild(card);
                });
            } else {
                resultsArea.innerHTML = `<div class="no-match">✅ No match found in database.</div>`;
            }
        });

            modal.style.display = "block";

        function closeModal() {

            successMessage.style.display = "none";
            errorMessage.style.display = "none";

        closeBtn.onclick = closeModal;
        cancelBtn.onclick = closeModal;

        window.onclick = function (event) {

        addPlayerForm.onsubmit = async function (e) {
            e.preventDefault();
            const playerName = document.getElementById('playerName').value.trim();
            const playerId = document.getElementById('playerId').value.trim();
            const playerReason = document.getElementById('playerReason').value.trim();

            if (!playerId) {
                errorMessage.textContent = "❌ Player ID is required!";
                errorMessage.style.display = "block";
                successMessage.style.display = "none";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Sending...";
            errorMessage.style.display = "none";
            successMessage.style.display = "none";

            try {
                const formData = new URLSearchParams();
                formData.append("Player Name", playerName);
                formData.append("Player ID", playerId);
                formData.append("Reason", playerReason);

                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData.toString()
                });

                successMessage.innerHTML = "✅ Request sent! Updating database...";
                successMessage.style.display = "block";
                errorMessage.style.display = "none";
                addPlayerForm.reset();

                setTimeout(() => {
                    loadData();
                    closeModal();
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Add to the list";
                }, 2500);

            } catch (error) {
                console.error('Error adding player:', error);
                errorMessage.textContent = "❌ Network error. Check your internet connection.";
                errorMessage.style.display = "block";
                successMessage.style.display = "none";
                submitBtn.disabled = false;
                submitBtn.textContent = "Add to the list";
            }
        }

        function renderCards(filterText = '') {
            guidesContainer.innerHTML = '';

            const filteredGuides = guidesData.filter(guide => {
                const searchLower = filterText.toLowerCase();
                return guide.title.toLowerCase().includes(searchLower) ||
                    guide.content.toLowerCase().includes(searchLower);
            });

            if (filteredGuides.length === 0) {
                guidesContainer.innerHTML = '<div class="no-results">No guides found matching your search.</div>';
                return;
            }

            filteredGuides.forEach((guide, index) => {
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                const displayContent = guide.content.replace(urlRegex, function (url) {
                    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
                });

                const card = document.createElement('div');
                card.className = 'guide-card';
                card.innerHTML = `
                    <h2 class="guide-title">${guide.title}</h2>
                    <button class="copy-btn" onclick="copyText(${index}, this)">Copy</button>
                    <div class="guide-content">${displayContent}</div>
                `;
                guidesContainer.appendChild(card);
            });
        }

        function copyText(index, buttonElement) {
            const textToCopy = guidesData[index].title + "\n\n" + guidesData[index].content;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = buttonElement.innerText;
                buttonElement.innerText = 'Copied!';
                buttonElement.style.backgroundColor = '#10b981';
                buttonElement.style.borderColor = '#10b981';
                buttonElement.style.color = 'white';

                setTimeout(() => {
                    buttonElement.innerText = originalText;
                    buttonElement.style.backgroundColor = '';
                    buttonElement.style.borderColor = '';
                    buttonElement.style.color = '';
                }, 2000);
            });
        }

            const allianceListEl = document.getElementById('alliance-list');
            const playerListEl = document.getElementById('player-list');
            const tableBodyEl = document.getElementById('table-body');
            const navControlsEl = document.getElementById('nav-controls');
            const currentViewTitleEl = document.getElementById('current-view-title');
            const searchInputLod = document.getElementById('lodSearchInput');
            const noResultsMsg = document.getElementById('no-results-msg');

            const getRankValue = (rankStr) => {
                const map = { 'R5': 5, 'R4': 4, 'R3': 3, 'R2': 2, 'R1': 1 };
                return map[rankStr.toUpperCase()] || 0;
            };

            function initLod() {
                renderAllianceCards();
            }

            function renderAllianceCards() {
                allianceListEl.innerHTML = '';
                Object.keys(allianceDatabase).forEach(key => {
                    const players = allianceDatabase[key];
                    const activeCount = players.filter(p => !p.former).length;
                    const formerCount = players.filter(p => p.former).length;

                    const card = document.createElement('div');
                    card.className = 'alliance-card';
                    card.onclick = () => showAlliancePlayers(key);

                    let cardHTML = `
                        <div class="alliance-name">${key}</div>
                        <div class="alliance-count">${activeCount} Players</div>
                    `;

                    if (formerCount > 0) {
                        cardHTML += `<div class="alliance-count-former">${formerCount} Former Players</div>`;
                    }

                    card.innerHTML = cardHTML;
                    allianceListEl.appendChild(card);
                });
            }

            function showAlliancePlayers(allianceName) {
                let players = allianceDatabase[allianceName];
                players.sort((a, b) => getRankValue(b.rank) - getRankValue(a.rank));
                renderTable(players, allianceName);

                allianceListEl.classList.remove('lod-grid-visible');
                allianceListEl.classList.add('lod-hidden');
                playerListEl.classList.add('lod-visible');
                navControlsEl.style.display = 'block';
                currentViewTitleEl.innerText = `// ${allianceName} ROSTER`;
            }

            function handleSearch(query) {
                const cleanQuery = query.toLowerCase().trim();

                if (cleanQuery === "") {
                    window.resetViewLod();
                    return;
                }

                let allPlayers = [];
                Object.keys(allianceDatabase).forEach(alliance => {
                    const playersWithTag = allianceDatabase[alliance].map(p => ({ ...p, allianceName: alliance }));
                    allPlayers = allPlayers.concat(playersWithTag);
                });

                const results = allPlayers.filter(p =>
                    p.name.toLowerCase().includes(cleanQuery) ||
                    p.id.includes(cleanQuery) ||
                    p.allianceName.toLowerCase().includes(cleanQuery)
                );

                results.sort((a, b) => getRankValue(b.rank) - getRankValue(a.rank));
                renderTable(results, null);

                allianceListEl.classList.add('lod-hidden');
                allianceListEl.classList.remove('lod-grid-visible');
                playerListEl.classList.add('lod-visible');
                navControlsEl.style.display = 'block';
                currentViewTitleEl.innerText = `// SEARCH RESULTS`;
            }

            function renderTable(players, fixedAllianceName) {
                tableBodyEl.innerHTML = '';

                if (players.length === 0) {
                    noResultsMsg.classList.remove('lod-hidden');
                } else {
                    noResultsMsg.classList.add('lod-hidden');
                    players.forEach(p => {
                        const row = document.createElement('tr');
                        if (p.former) {
                            row.classList.add('is-former');
                        }

                        const dispAlliance = fixedAllianceName || p.allianceName;

                        row.innerHTML = `
                            <td><span class="rank-badge rank-${p.rank}">${p.rank}</span></td>
                            <td>${dispAlliance}</td>
                            <td>${p.name} ${p.former ? ' <span style="font-size:0.7em; color:var(--former-color)">(FORMER)</span>' : ''}</td>
                            <td><span class="clickable-id" onclick="window.copyToClipboardLod('${p.id}')">${p.id}</span></td>
                        `;
                        tableBodyEl.appendChild(row);
                    });
                }
            }

            window.copyToClipboardLod = function (text) {
                navigator.clipboard.writeText(text).then(() => {
                    const toast = document.getElementById('toast');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2000);
                });
            }

            window.resetViewLod = function () {
                allianceListEl.classList.remove('lod-hidden');
                allianceListEl.classList.add('lod-grid-visible');
                playerListEl.classList.remove('lod-visible');
                navControlsEl.style.display = 'none';
                searchInputLod.value = '';
                renderAllianceCards();
            }

            searchInputLod.addEventListener('input', (e) => {
                handleSearch(e.target.value);
            });

            initLod();
        })();

        /* --------------------------------------------------------------------------
           REDEEM GIFT CODE LOGIC
           -------------------------------------------------------------------------- */
        (() => {
            // TODO: Replace this URL with your actual Cloudflare Worker URL after deployment
            const WORKER_URL = 'https://autokgc-trigger.twikilab.workers.dev';

            const redeemFab = document.getElementById('redeemFab');
            const redeemToast = document.getElementById('redeemToast');
            let toastTimeout;

            function showToast(message, type) {
                redeemToast.textContent = message;
                redeemToast.className = `redeem-toast show ${type}`;

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    redeemToast.classList.remove('show');
                }, 4000);
            }

            redeemFab.onclick = async () => {
                // Prevent multiple clicks while triggering
                if (redeemFab.disabled) return;

                redeemFab.disabled = true;
                const originalContent = redeemFab.innerHTML;
                redeemFab.innerHTML = '⏳';
                redeemFab.style.animation = 'none';

                try {
                    const resp = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    const data = await resp.json().catch(() => null);

                    if (resp.ok && data && data.success) {
                        showToast('✅ Gift code redemption triggered successfully!', 'success');
                    } else {
                        showToast(`❌ Failed to trigger: ${data?.error || resp.statusText}`, 'error');
                    }
                } catch (err) {
                    showToast('❌ Network error. Is the worker URL correct?', 'error');
                }

                redeemFab.disabled = false;
                redeemFab.innerHTML = originalContent;
                redeemFab.style.animation = 'redeemPulse 2.5s ease-in-out infinite';
            };
        })();
